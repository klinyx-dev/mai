[package]
name = "mai"
version = "0.1.0"
edition = "2024"
description = "Headless Rust scheduling core for deterministic weekly scheduling workflows."
license = "MIT"
repository = "https://github.com/klinyx-dev/mai.git"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[dev-dependencies]
proptest = "1"
