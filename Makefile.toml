[config]
default_to_workspace = false
skip_core_tasks = true

[env]
IMAGE_NAME = "mai"
WORKSPACE_DIR = "/workspace"
CARGO_HOME_IN_CONTAINER = "/usr/local/cargo"
CARGO_REGISTRY_VOL = "cargo-registry"
CARGO_GIT_VOL = "cargo-git"
TARGET_VOL = "scheduler-target"
HOST_MOUNT = "${CARGO_MAKE_WORKING_DIRECTORY}"

[tasks.ensure-podman]
description = "Verify podman is installed"
command = "podman"
args = ["--version"]

[tasks.machine-init]
description = "Initialize podman machine if needed"
linux_alias = "machine-init-unix"
mac_alias = "machine-init-unix"
windows_alias = "machine-init-windows"

[tasks.machine-init-unix]
description = "Initialize podman machine if needed on Unix-like hosts"
script_runner = "@shell"
script = '''
podman machine inspect >/dev/null 2>&1 || podman machine init
'''

[tasks.machine-init-windows]
description = "Initialize podman machine if needed on Windows"
command = "cmd"
args = ["/d", "/c", "podman machine inspect >NUL 2>&1 || podman machine init"]

[tasks.machine-start]
description = "Start podman machine"
linux_alias = "machine-start-unix"
mac_alias = "machine-start-unix"
windows_alias = "machine-start-windows"

[tasks.machine-start-unix]
description = "Start podman machine on Unix-like hosts"
script_runner = "@shell"
script = '''
podman machine start >/dev/null 2>&1 || true
'''

[tasks.machine-start-windows]
description = "Start podman machine on Windows"
command = "cmd"
args = ["/d", "/c", "podman machine start >NUL 2>&1 || exit /b 0"]

[tasks.prepare]
description = "Prepare local podman environment"
dependencies = ["ensure-podman", "machine-init", "machine-start"]

[tasks.build-image]
description = "Build dev image"
dependencies = ["prepare"]
command = "podman"
args = ["build", "-t", "${IMAGE_NAME}", "-f", "Containerfile", "."]

[tasks.shell]
description = "Open interactive shell in dev container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-it",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "bash",
]

[tasks.check]
description = "Run cargo check in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "cargo",
  "check",
]

[tasks.test]
description = "Run cargo test in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "cargo",
  "test",
]

[tasks.fmt]
description = "Run cargo fmt check in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "cargo",
  "fmt",
  "--all",
  "--check",
]

[tasks.clippy]
description = "Run cargo clippy in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "cargo",
  "clippy",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]

[tasks.wasm-check]
description = "Run wasm target check in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "cargo",
  "check",
  "--target",
  "wasm32-unknown-unknown",
]

[tasks.wasm-smoke]
description = "Run generated wasm package smoke validation in container"
dependencies = ["build-image"]
command = "podman"
args = [
  "run",
  "--rm",
  "-v", "${HOST_MOUNT}:${WORKSPACE_DIR}",
  "-v", "${CARGO_REGISTRY_VOL}:${CARGO_HOME_IN_CONTAINER}/registry",
  "-v", "${CARGO_GIT_VOL}:${CARGO_HOME_IN_CONTAINER}/git",
  "-v", "${TARGET_VOL}:${WORKSPACE_DIR}/target",
  "-e", "CARGO_TARGET_DIR=${WORKSPACE_DIR}/target",
  "-w", "${WORKSPACE_DIR}",
  "${IMAGE_NAME}",
  "bash",
  "-lc",
  "core/tests/run_generated_package_smoke.sh",
]

[tasks.ci]
description = "Run full validation flow"
dependencies = ["fmt", "clippy", "test", "wasm-check", "wasm-smoke"]
